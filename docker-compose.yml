services:
  db:
    image: postgres:15-alpine
    container_name: facturapro_db
    environment:
      POSTGRES_DB: facturapro
      POSTGRES_USER: facturapro
      POSTGRES_PASSWORD: facturapro_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: facturapro_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
